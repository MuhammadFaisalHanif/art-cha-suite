<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ART Quote Helper</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2335;--card:#232840;--border:#2a2f4a;--border2:#363d5e;--text:#e8eaf0;--text2:#8892b4;--text3:#4a5070;--active:#10b981;--accent:#4f6ef7;--r:8px;--r2:5px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#111827;border-bottom:1px solid #374151;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:34px;height:34px;background:linear-gradient(135deg,#4f6ef7,#10b981);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-name{font-size:14px;font-weight:600;color:#f9fafb}
.logo-sub{font-size:11px;color:#9ca3af}
.top-info{font-size:12px;color:var(--text2)}
.wrap{padding:20px 22px;max-width:1200px;margin:0 auto}
.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.hero-lbl{font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:12px}
.tabs{display:flex;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;width:fit-content;margin-bottom:14px}
.tab{padding:7px 20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--bg3);color:var(--text2);border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.tab.on{background:var(--accent);color:#fff}
.row{display:flex;gap:10px;align-items:center}
.sw{position:relative;flex:1}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:11px 14px;color:var(--text);font-size:14px;font-family:'DM Mono',monospace;outline:none;transition:border .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.1)}
.inp::placeholder{color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px}
.sbox{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);z-index:30;max-height:220px;overflow-y:auto;display:none}
.sbox.open{display:block}
.si{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.si:hover,.si.hi{background:var(--bg3)}
.si:last-child{border-bottom:none}
.si-n{font-weight:500}
.si-m{font-size:11px;color:var(--text2);margin-top:2px}
.btn{font-family:'DM Sans',sans-serif;padding:10px 20px;border-radius:var(--r2);font-size:13px;font-weight:500;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--card);border-color:var(--accent)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;padding:11px 26px;font-size:14px}
.btn-p:hover{background:#3d5fe0}
.idle{padding:60px 20px;text-align:center;color:var(--text3)}
.idle-ic{font-size:48px;margin-bottom:12px}
.idle-t{font-size:15px;color:var(--text2);font-weight:500;margin-bottom:6px}
.idle-s{font-size:13px;line-height:1.7}
.tips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.tip{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:7px 13px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.tip:hover{border-color:var(--accent);color:var(--text)}
.cc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.cn{font-size:16px;font-weight:600;margin-bottom:3px}
.cs{font-size:12px;color:var(--text2);margin-bottom:10px}
.crow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.cpills{display:flex;gap:7px;flex-wrap:wrap}
.cp{padding:5px 12px;border-radius:var(--r2);font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent}
.cp-a{background:#052e16;color:#6ee7b7;border-color:#065f46}
.cp-s{background:#451a03;color:#fcd34d;border-color:#92400e}
.cp-e{background:#450a0a;color:#fca5a5;border-color:#7f1d1d}
.cp-n{background:#1f2937;color:#9ca3af;border-color:#374151}
.cp-all{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.ca{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r2);font-size:12px;font-weight:500;cursor:pointer;background:#052e16;border:1px solid #065f46;color:#6ee7b7;font-family:'DM Sans',sans-serif}
.ca:hover{background:#065f46}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.mc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.mc:hover{border-color:var(--border2)}
.mct{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.mcs{font-family:'DM Mono',monospace;font-size:14px;font-weight:600}
.mcm{font-size:11px;color:var(--text2);margin-top:2px}
.mcb{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.mf{display:flex;flex-direction:column;gap:2px}
.mf.fw{grid-column:1/-1}
.mfl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.mfv{font-size:12px;font-weight:500}
.mfv.mn{font-family:'DM Mono',monospace}
.mcf{display:flex;align-items:center;justify-content:space-between;padding-top:9px;border-top:1px solid var(--border)}
.cpb{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r2);font-size:11px;font-weight:500;cursor:pointer;background:var(--bg);border:1px solid var(--border2);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s}
.cpb:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.sc{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.sct{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:14px}
.scg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sf{display:flex;flex-direction:column;gap:3px}
.sf.fw{grid-column:1/-1}
.sfl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.sfv{font-size:13px;font-weight:500}
.sfv.mn{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent)}
.sca{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:500;white-space:nowrap}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-act{background:#052e16;color:#6ee7b7}.b-act:before{background:#10b981}
.b-sn{background:#451a03;color:#fcd34d}.b-sn:before{background:#f59e0b}
.b-d90{background:#431407;color:#fed7aa}.b-d90:before{background:#fb923c}
.b-exp{background:#450a0a;color:#fca5a5}.b-exp:before{background:#ef4444}
.b-nc{background:#1f2937;color:#9ca3af}.b-nc:before{background:#4b5563}
.b-nd{background:#1e1b4b;color:#a5b4fc}.b-nd:before{background:#6366f1}
.eb{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600}
.eRobin{background:#1e3a5f;color:#93c5fd}
.eAbhith{background:#022c22;color:#6ee7b7}
.ePrijo{background:#451a03;color:#fcd34d}
.eShyju{background:#2e1065;color:#c4b5fd}
.eUnassigned{background:#1f2937;color:#9ca3af}
.ml{display:flex;flex-direction:column;gap:8px}
.mi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;transition:all .15s}
.mi:hover{background:var(--bg3);border-color:var(--border2)}
.nr{padding:48px;text-align:center;color:var(--text3);font-size:13px}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:11px 16px;font-size:13px;z-index:200;display:none;align-items:center;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{display:flex;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.ok{border-left:3px solid #10b981;color:#6ee7b7}
.loading{padding:60px;text-align:center;color:var(--text2);font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">
    <div class="logo-box">&#x1F4CB;</div>
    <div><div class="logo-name">Quote Helper</div><div class="logo-sub">Al Reyami Technologies &#x2014; Machine lookup for quotes</div></div>
  </div>
  <div class="top-info" id="topInfo">Loading...</div>
</div>
<div class="wrap">
  <div class="hero">
    <div class="hero-lbl">&#x1F50D; Search by</div>
    <div class="tabs">
      <button class="tab on" id="tabCust">Customer Name</button>
      <button class="tab" id="tabSerial">Serial Number</button>
    </div>
    <div class="row">
      <div class="sw">
        <input class="inp" id="mainInp" placeholder="Start typing customer name..." autocomplete="off">
        <div class="sbox" id="sbox"></div>
      </div>
      <button class="btn btn-p" id="searchBtn">Search</button>
      <button class="btn" id="clearBtn">&#x2715;</button>
    </div>
  </div>
  <div id="area"><div class="loading">&#x231B; Loading machine data...</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var B64DATA="";

var DB = [];
var curTab = 'cust';
var sugIdx = -1;
var curMachines = [];

var SC = {'ACTIVE':'act','EXPIRING SOON':'sn','EXPIRING 90D':'d90','WARRANTY EXPIRED':'exp','AMC EXPIRED':'exp','EXPIRED':'exp','NO CONTRACT':'nc','NO DATE':'nd'};
var SL = {'ACTIVE':'Active','EXPIRING SOON':'Expiring Soon','EXPIRING 90D':'Expiring 90d','WARRANTY EXPIRED':'Wty Expired','AMC EXPIRED':'AMC Expired','EXPIRED':'Expired','NO CONTRACT':'No Contract','NO DATE':'No Date'};

function fmtD(d){if(!d)return'&#x2014;';var p=d.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:d;}
function badge(s){var c=SC[s]||'nd';return '<span class="badge b-'+c+'">'+(SL[s]||s)+'</span>';}
function eng(e){var v=e||'Unassigned';return '<span class="eb e'+v+'">'+v+'</span>';}

// ── SUPABASE LIVE DATA ────────────────────────────────────────────────────
// If CHA_CONFIG has Supabase credentials, load live data. Otherwise use embedded.
async function loadMachinesFromSupabase(){
  if(typeof CHA_CONFIG==='undefined' || !CHA_CONFIG.supabaseUrl || !CHA_CONFIG.supabaseAnonKey){
    return null; // offline mode: use embedded data
  }
  try{
    var client = window.supabase.createClient(CHA_CONFIG.supabaseUrl, CHA_CONFIG.supabaseAnonKey);
    var all = [], from = 0, pageSize = 1000, done = false;
    while(!done){
      var res = await client.from('machines')
        .select('id,customer_name,branch,model,serial_number,agreement_type,correct_status,start_date,end_date,assigned_engineer_id')
        .range(from, from + pageSize - 1);
      if(res.error) throw res.error;
      var rows = res.data || [];
      all = all.concat(rows);
      if(rows.length < pageSize) done = true;
      else from += pageSize;
    }
    // Map Supabase fields to HTML format
    return all.map(function(r){
      var cs = (r.correct_status || '').toLowerCase();
      var stype = 'NO CONTRACT';
      if(cs === 'warranty') stype = 'WARRANTY WITH SPARE PARTS';
      else if(cs === 'amc') stype = 'AMC WITH SPARE PARTS';
      else if(cs === 'expired') stype = 'AMC WITH SPARE PARTS';
      else if(cs === 'no_contract') stype = 'NO CONTRACT';
      return {
        id: r.id || '',
        customer: r.customer_name || '',
        branch: r.branch || '',
        dept: 'ADMIN',
        model: r.model || '',
        serial: r.serial_number || '',
        agreement: r.agreement_type || 'SALES',
        service_type: stype,
        start_date: r.start_date || '',
        end_date: r.end_date || '',
        engineer: 'Unassigned',
        pm: 'NO',
        status: ''
      };
    });
  }catch(e){
    console.warn('Supabase load failed, using embedded data:', e);
    return null;
  }
}

async function init(){
  // Try Supabase live data first, fall back to embedded
  var live = await loadMachinesFromSupabase();
  if(live){
    DB = live;
  } else {
    // Decode base64 data
    var raw = atob(B64DATA);
    var bytes = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    var str = new TextDecoder('utf-8').decode(bytes);
    DB = JSON.parse(str);
  }

  document.getElementById('topInfo').textContent = DB.length.toLocaleString() + ' machines loaded';
  document.getElementById('area').innerHTML = idleHtml();
  buildTips();

  // Tab events
  document.getElementById('tabCust').addEventListener('click', function(){ setTab('cust'); });
  document.getElementById('tabSerial').addEventListener('click', function(){ setTab('serial'); });
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('mainInp').addEventListener('input', onInput);
  document.getElementById('mainInp').addEventListener('keydown', onKey);
  document.addEventListener('click', function(e){ if(!e.target.closest('.sw')) closeSug(); });
}

function setTab(t){
  curTab=t;
  document.getElementById('tabCust').classList.toggle('on',t==='cust');
  document.getElementById('tabSerial').classList.toggle('on',t==='serial');
  document.getElementById('mainInp').placeholder = t==='cust'?'Start typing customer name...':'Enter serial number...';
  document.getElementById('mainInp').value='';
  closeSug();
  document.getElementById('area').innerHTML=idleHtml();
}

function idleHtml(){return '<div class="idle"><div class="idle-ic">&#x1F4CB;</div><div class="idle-t">Ready to look up machine details</div><div class="idle-s">Search by customer name or serial number<br>to get full machine and contract info for your quote</div><div class="tips" id="tipsEl"></div></div>';}

function buildTips(){
  var el=document.getElementById('tipsEl');
  if(!el)return;
  var counts={};
  DB.forEach(function(m){if(m.customer)counts[m.customer]=(counts[m.customer]||0)+1;});
  var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,6);
  top.forEach(function(c){
    var d=document.createElement('div');
    d.className='tip';
    d.textContent=c+' ('+counts[c]+')';
    d.addEventListener('click',function(){
      document.getElementById('mainInp').value=c;
      curTab='cust';
      document.getElementById('tabCust').classList.add('on');
      document.getElementById('tabSerial').classList.remove('on');
      doSearch();
    });
    el.appendChild(d);
  });
}

function onInput(){
  if(curTab==='cust') buildSug(document.getElementById('mainInp').value.trim());
  else closeSug();
}

function onKey(e){
  var items=document.getElementById('sbox').querySelectorAll('.si');
  if(e.key==='ArrowDown'){sugIdx=Math.min(sugIdx+1,items.length-1);items.forEach(function(it,i){it.classList.toggle('hi',i===sugIdx);});e.preventDefault();}
  else if(e.key==='ArrowUp'){sugIdx=Math.max(sugIdx-1,0);items.forEach(function(it,i){it.classList.toggle('hi',i===sugIdx);});e.preventDefault();}
  else if(e.key==='Enter'){if(sugIdx>=0&&items[sugIdx])items[sugIdx].click();else doSearch();closeSug();}
  else if(e.key==='Escape')closeSug();
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function buildSug(q){
  var box=document.getElementById('sbox');
  if(!q||q.length<2){closeSug();return;}
  var ql=q.toLowerCase(),seen={},results=[];
  for(var i=0;i<DB.length;i++){var c=DB[i].customer;if(!c||seen[c])continue;if(c.toLowerCase().indexOf(ql)>=0){seen[c]=1;results.push(c);}if(results.length>=10)break;}
  if(!results.length){closeSug();return;}
  sugIdx=-1;
  box.innerHTML=results.map(function(c){
    var cnt=0,act=0;
    DB.forEach(function(m){if(m.customer===c){cnt++;if(m.status==='ACTIVE')act++;}});
    return '<div class="si" data-n="'+encodeURIComponent(c)+'"><div class="si-n">'+escH(c)+'</div><div class="si-m">'+cnt+' machines &middot; '+act+' active</div></div>';
  }).join('');
  box.querySelectorAll('.si').forEach(function(el){
    el.addEventListener('click',function(){
      document.getElementById('mainInp').value=decodeURIComponent(this.getAttribute('data-n'));
      closeSug();doSearch();
    });
  });
  box.classList.add('open');
}

function closeSug(){document.getElementById('sbox').classList.remove('open');sugIdx=-1;}

function doSearch(){
  closeSug();
  var v=document.getElementById('mainInp').value.trim();
  if(!v)return;
  var area=document.getElementById('area');
  if(curTab==='serial'){
    var vl=v.toLowerCase();
    var matches=DB.filter(function(m){return(m.serial||'').toLowerCase().indexOf(vl)>=0;});
    if(!matches.length){area.innerHTML='<div class="nr">No machine found with serial containing &ldquo;'+v+'&rdquo;</div>';return;}
    if(matches.length===1){area.innerHTML=singleCard(matches[0]);return;}
    area.innerHTML='<div class="rh"><div style="font-size:14px;font-weight:600">'+matches.length+' machines found</div><div style="font-size:12px;color:var(--text2)">Serial: &ldquo;'+v+'&rdquo;</div></div><div class="mgrid">'+matches.map(machCard).join('')+'</div>';
    return;
  }
  var vl2=v.toLowerCase(),seen={},custs=[];
  DB.forEach(function(m){if(m.customer&&!seen[m.customer]&&m.customer.toLowerCase().indexOf(vl2)>=0){seen[m.customer]=1;custs.push(m.customer);}});
  if(!custs.length){area.innerHTML='<div class="nr">No customer found matching &ldquo;'+v+'&rdquo;</div>';return;}
  if(custs.length===1){showCust(custs[0]);return;}
  var html='<div class="rh"><div style="font-size:14px;font-weight:600">'+custs.length+' customers found</div><div style="font-size:12px;color:var(--text2)">Click to view</div></div><div class="ml">';
  custs.forEach(function(c){
    var cnt=0,act=0;DB.forEach(function(m){if(m.customer===c){cnt++;if(m.status==='ACTIVE')act++;}});
    html+='<div class="mi" data-c="'+encodeURIComponent(c)+'"><div style="font-size:14px;font-weight:600;margin-bottom:3px">'+c+'</div><div style="font-size:12px;color:var(--text2)">'+cnt+' machines &middot; <span style="color:var(--active)">'+act+' active</span></div></div>';
  });
  html+='</div>';
  area.innerHTML=html;
  area.querySelectorAll('.mi').forEach(function(el){el.addEventListener('click',function(){showCust(decodeURIComponent(this.getAttribute('data-c')));});});
}

function showCust(cust){
  curMachines=DB.filter(function(m){return m.customer===cust;});
  var total=curMachines.length;
  var act=curMachines.filter(function(m){return m.status==='ACTIVE';}).length;
  var sn=curMachines.filter(function(m){return m.status==='EXPIRING SOON'||m.status==='EXPIRING 90D';}).length;
  var exp=curMachines.filter(function(m){return m.status.indexOf('EXPIRED')>=0;}).length;
  var nc=curMachines.filter(function(m){return m.status==='NO CONTRACT';}).length;
  var html='<div class="cc"><div class="cn">'+cust+'</div><div class="cs">'+total+' machine'+(total>1?'s':'')+' in database</div>';
  html+='<div class="crow"><div class="cpills">';
  html+='<span class="cp cp-all" data-f="">All: '+total+'</span>';
  if(act) html+='<span class="cp cp-a" data-f="ACTIVE">&#x2713; Active: '+act+'</span>';
  if(sn)  html+='<span class="cp cp-s" data-f="EXPIRING">&#x26A0; Expiring: '+sn+'</span>';
  if(exp) html+='<span class="cp cp-e" data-f="EXPIRED">&#x2717; Expired: '+exp+'</span>';
  if(nc)  html+='<span class="cp cp-n" data-f="NC">No Contract: '+nc+'</span>';
  html+='</div><button class="ca" id="caBtn">&#x1F4CB; Copy All for Quote</button></div></div>';
  html+='<div class="mgrid" id="mCards">'+curMachines.map(machCard).join('')+'</div>';
  document.getElementById('area').innerHTML=html;
  document.getElementById('caBtn').addEventListener('click',copyAll);
  document.getElementById('area').querySelectorAll('.cp').forEach(function(el){
    el.addEventListener('click',function(){
      var f=this.getAttribute('data-f');
      var m=curMachines;
      if(f==='ACTIVE')   m=m.filter(function(x){return x.status==='ACTIVE';});
      if(f==='EXPIRING') m=m.filter(function(x){return x.status==='EXPIRING SOON'||x.status==='EXPIRING 90D';});
      if(f==='EXPIRED')  m=m.filter(function(x){return x.status.indexOf('EXPIRED')>=0;});
      if(f==='NC')       m=m.filter(function(x){return x.status==='NO CONTRACT';});
      document.getElementById('mCards').innerHTML=m.map(machCard).join('');
      wireCopyBtns();
    });
  });
  wireCopyBtns();
}

function wireCopyBtns(){
  document.querySelectorAll('.cpb').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-idx'));
      var m=DB[idx];
      if(!m)return;
      var text='Customer: '+(m.customer||'')+'\nSerial No: '+(m.serial||'')+'\nModel: '+(m.model||'')+'\nFile No: '+(m.id||'')+'\nBranch: '+(m.branch||'')+'\nDepartment: '+(m.dept||'')+'\nContract Type: '+(m.service_type||'')+'\nStart Date: '+fmtD(m.start_date)+'\nEnd Date: '+fmtD(m.end_date)+'\nStatus: '+(m.status||'')+'\nEngineer: '+(m.engineer||'');
      navigator.clipboard.writeText(text).then(function(){toast('Machine details copied &#x2014; paste into ERP quote');});
    });
  });
}

function copyAll(){
  if(!curMachines.length)return;
  var lines=['MACHINE LIST &#x2014; '+(curMachines[0].customer||''),''];
  lines.push('Serial No             | Model          | File No        | Branch                 | Contract Type              | Start      | End        | Status              | Engineer');
  lines.push('--'.repeat(60));
  curMachines.forEach(function(m){
    lines.push([(m.serial||'').padEnd(22),(m.model||'').padEnd(16),(m.id||'').padEnd(16),(m.branch||'').padEnd(24),(m.service_type||'').padEnd(28),fmtD(m.start_date).padEnd(12),fmtD(m.end_date).padEnd(12),(m.status||'').padEnd(21),(m.engineer||'')].join('| '));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    toast('All '+curMachines.length+' machines copied');
    var btn=document.getElementById('caBtn');
    if(btn){btn.textContent='&#x2713; Copied!';setTimeout(function(){btn.textContent='&#x1F4CB; Copy All for Quote';},2000);}
  });
}

function singleCard(m){
  var dbIdx=DB.indexOf(m);
  return '<div class="sc"><div class="sct">&#x1F4CD; Machine found</div><div class="scg">'+
    sf('Serial Number',m.serial||'&#x2014;',true,true)+
    sf('Customer',m.customer||'&#x2014;',true,false)+
    sf('Model',m.model||'&#x2014;',false,false)+
    sf('File No',m.id||'&#x2014;',false,true)+
    sf('Branch',m.branch||'&#x2014;',false,false)+
    sf('Department',m.dept||'&#x2014;',false,false)+
    sf('Contract Type',m.service_type||'&#x2014;',true,false)+
    sf('Start Date',fmtD(m.start_date),false,true)+
    sf('End Date',fmtD(m.end_date),false,true)+
    '<div class="sf"><div class="sfl">Status</div><div>'+badge(m.status)+'</div></div>'+
    '<div class="sf"><div class="sfl">Engineer</div><div>'+eng(m.engineer)+'</div></div>'+
    sf('PM',m.pm||'NO',false,false)+
    '</div><div class="sca"><button class="cpb btn" data-idx="'+dbIdx+'">&#x1F4CB; Copy for Quote</button></div></div>';
}

function sf(l,v,fw,mn){return '<div class="sf'+(fw?' fw':'')+'" ><div class="sfl">'+l+'</div><div class="sfv'+(mn?' mn':'')+'" >'+v+'</div></div>';}

function machCard(m){
  var dbIdx=DB.indexOf(m);
  return '<div class="mc"><div class="mct"><div><div class="mcs">'+(m.serial||'&#x2014;')+'</div><div class="mcm">'+(m.model||'')+'</div></div>'+badge(m.status)+'</div>'+
    '<div class="mcb">'+
    mf('Branch',m.branch||'&#x2014;',false,false)+
    mf('File No',m.id||'&#x2014;',true,false)+
    mf('Contract Type',m.service_type||'&#x2014;',false,true)+
    mf('Start Date',fmtD(m.start_date),true,false)+
    mf('End Date',fmtD(m.end_date),true,false)+
    '</div>'+
    '<div class="mcf">'+eng(m.engineer)+'<button class="cpb cpb" data-idx="'+dbIdx+'">&#x1F4CB; Copy</button></div>'+
    '</div>';
}

function mf(l,v,mn,fw){return '<div class="mf'+(fw?' fw':'')+'" ><div class="mfl">'+l+'</div><div class="mfv'+(mn?' mn':'')+'" >'+v+'</div></div>';}

function clearAll(){document.getElementById('mainInp').value='';closeSug();document.getElementById('area').innerHTML=idleHtml();setTimeout(buildTips,10);}

var tTimer;
function toast(msg){var t=document.getElementById('toast');t.className='toast show ok';t.innerHTML=msg;clearTimeout(tTimer);tTimer=setTimeout(function(){t.classList.remove('show');},3000);}

window.addEventListener('load', init);
</script>
</body>
